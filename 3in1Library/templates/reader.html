<!DOCTYPE html>
<html>
<head>
    <title>Reading: {{ book_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* A little extra styling to make it look like a reading app */
        body {
            background-color: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .toolbar {
            width: 100%;
            padding: 15px;
            background: #2c2f33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .reader-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .page-btn {
            padding: 8px 16px;
            background: #7289da;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .page-btn:hover {
            background: #5b6eae;
        }
        #the-canvas {
            margin-top: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: white; /* The paper is white */
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div style="flex: 1; display: flex; justify-content: flex-start;">
            <a href="/books" class="backbutton" style="position: static; margin: 0;">
                <img src="{{ url_for('static', filename='icons/back.png') }}" class="back-icon">
            </a>
        </div>
        
        <div class="reader-controls" style="flex: 1; display: flex; justify-content: center;">
            <button id="prev" class="page-btn">Previous Page</button>
            <span>Page: 
                <input type="number" id="page_num_input" value="{{ start_page }}" min="1" 
                style="width: 50px; text-align: center; background: #1e1e1e; color: white; border: 1px solid #7289da; border-radius: 4px; padding: 4px;"> 
                / <span id="page_count"></span>
            </span>
            <button id="next" class="page-btn">Next Page</button>
        </div>
        
        <div style="flex: 1;"></div> 
    </div>
    <canvas id="the-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const url = "{{ url_for('static', filename='books/' + book_name) }}";
        const currentFilename = "{{ book_name }}";

        let pdfDoc = null,
            // START ON THE SAVED PAGE INSTEAD OF 1
            pageNum = {{ start_page }}, 
            pageRendering = false,
            pageNumPending = null,
            scale = 1.2,
            canvas = document.getElementById('the-canvas'),
            ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;
            
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('page_num_input').value = num;

            // --- NEW: SAVE BOOKMARK TO SERVER ---
            // We use the JavaScript Fetch API to send a POST request without reloading the page
            fetch('/save_bookmark', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    filename: currentFilename,
                    page: num
                })
            }).then(response => console.log("Bookmark saved: Page " + num));
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        document.getElementById('prev').addEventListener('click', function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        document.getElementById('page_num_input').addEventListener('change', function() {
            // Convert the typed value into a real integer
            let requestedPage = parseInt(this.value);

            // Validate: Make sure they didn't type a negative number or a number bigger than the book
            if (requestedPage >= 1 && requestedPage <= pdfDoc.numPages) {
                pageNum = requestedPage;
                queueRenderPage(pageNum);
            } else {
                // If they typed an invalid number, reset the box back to the current page
                this.value = pageNum;
            }
        });

        pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('page_count').textContent = pdfDoc.numPages;
            
            // Render the saved page right away
            renderPage(pageNum);
        }).catch(function(error) {
            console.error("Error loading PDF: ", error);
        });
    </script>

</body>
</html>
